[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "core",
    "sandbox",
    "tools",
    "pyarrow>=25.0.1",
]

[tool.uv.sources]
core = { workspace = true }
sandbox = { workspace = true }
tools = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
