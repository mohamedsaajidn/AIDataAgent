[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "core",
    "python-multipart>=0.0.32",
    "tools",
    "agent",
]

[tool.uv.sources]
core = { workspace = true }
tools = { workspace = true }
agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
